# The Detailing Mafia Poonamallee landing page
# lp.tdmpoonamallee.in
#
# Static page: deploy/deploy-kvm.sh uploads index.html + assets/ to the docroot.
#
# Two names are served here:
#   lp.tdmpoonamallee.in                         - the live home. Goes live once an A
#                                                  record at Hostinger points lp at this
#                                                  box (DEPLOYMENT.md). Until then the
#                                                  name resolves nowhere, so listing it
#                                                  here changes nothing.
#   tdmpoonamallee-preview.187.127.149.216.nip.io - the review link; nip.io resolves
#                                                  to this box with no DNS change
#
# Indexing: the page's canonical points at the live name, and only the review
# link sends X-Robots-Tag noindex.
#
# Deliberately NOT default_server: rentla-preview holds it on this box, and
# claiming it here would change where every unmatched hostname lands.
#
# gzip is inherited from nginx.conf (on, with CSS and JS in gzip_types).
#
# Caching is set with `expires`, never with add_header inside a location. A
# location that declares any add_header silently drops every add_header it
# would inherit from the server block, which is why other vhosts on this box
# repeat their security headers in each location. `expires` is not add_header,
# so the three headers below reach every response from this one place.
#
# HTTP-only as written; certbot --nginx rewrites the server copy to add the
# :443 block and the 80->443 redirect. This file is the pre-certbot source.

# Empty for the live name, so add_header sends nothing there (nginx skips a
# header whose value evaluates to ""). Prefixed to stay unique across the
# http-level namespace every vhost on this box shares.
map $host $tdmpoonamallee_robots {
    default                                          "";
    tdmpoonamallee-preview.187.127.149.216.nip.io    "noindex, nofollow";
}

server {
    listen 80;
    listen [::]:80;

    server_name lp.tdmpoonamallee.in tdmpoonamallee-preview.187.127.149.216.nip.io;

    root /var/www/lp.tdmpoonamallee.in;
    index index.html;

    access_log /var/log/nginx/lp.tdmpoonamallee.in.access.log;
    error_log  /var/log/nginx/lp.tdmpoonamallee.in.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag $tdmpoonamallee_robots always;

    # Must win over the dotfile rule below, or issuance and every silent 60-day
    # renewal would fail. ^~ beats a regex location, hence this form.
    location ^~ /.well-known/acme-challenge/ {
        allow all;
    }

    # Photos keep their filenames across deploys, so they get the house month,
    # not a year. Replace a photo under a NEW filename (or bump its ?v= in
    # index.html), or returning visitors keep the old one for up to 30 days.
    location ^~ /assets/img/ {
        expires 30d;
        access_log off;
    }

    # style.css and main.js are linked as ?v=..., so bumping ?v= in index.html
    # reaches every visitor at once. The one-day cap only matters if a file is
    # changed without the bump.
    location ^~ /assets/ {
        expires 1d;
        access_log off;
    }

    # "/" reaches this block too, via the index directive's internal redirect.
    # Revalidated on every visit, so a redeploy shows on the next page load.
    location = /index.html {
        expires -1;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
